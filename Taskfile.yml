version: '3'

tasks:
  test:
    desc: Run unit tests
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod gotestsum -- -race {{.ARGS}}

  compose-up:
    desc: Start the docker compose test dependencies (SeaweedFS, fake-gcs-server) and wait until healthy
    cmds:
      # --wait blocks until each service's healthcheck passes, so tests started
      # right after this won't race a not-yet-serving API (see healthchecks in
      # docker-compose.yml).
      - docker compose up -d --wait

  compose-down:
    desc: Stop the docker compose test dependencies and remove their volumes
    cmds:
      - docker compose down -v

  check:
    desc: Run all static checks
    cmds:
      - task: fmt
        vars:
          CLI_ARGS: ./... --diff
      - task: lint
      - task: license
        vars:
          CLI_ARGS: -check .
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff
      - task: release-check

  fix:
    desc: Auto-fix static checks
    cmds:
      - task: fmt
      - task: license
      - task: mod-tidy
      - task: lint
        vars:
          CLI_ARGS: ./... --fix

  release-check:
    desc: Check if the release is ready to be published
    cmds:
      - go tool -modfile tools/go.mod goreleaser check

  lint:
    desc: Run golangci-lint
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint run {{.ARGS}}

  fmt:
    desc: Format the code
    vars:
      ARGS: '{{default "./..." .CLI_ARGS}}'
    cmds:
      - go tool -modfile tools/go.mod golangci-lint fmt {{.ARGS}}

  license:
    desc: Manage license headers
    vars:
      ARGS: '{{default "." .CLI_ARGS}}'
    cmds:
      - |
        go tool -modfile tools/go.mod addlicense \
          -c "Pete Steyert-Woods" \
          -l apache \
          -s \
          -ignore ".idea/**" \
          -ignore ".github/**" \
          -ignore ".claude/**" \
          -ignore "coverage.*" \
          {{.ARGS}}

  mod-tidy:
    desc: Run 'go mod tidy'
    vars:
      ARGS: '{{default "-v" .CLI_ARGS}}'
    cmds:
      - go mod tidy {{.ARGS}}
      - go -C tools mod tidy {{.ARGS}}

  mod-download:
    desc: Run 'go mod download'
    cmds:
      - go mod download
      - go mod download -modfile tools/go.mod

  generate:
    desc: Run go generate
    cmds:
      - go generate ./...

  # CI tasks

  ci:test:
    desc: Run unit tests with coverage and produce a Cobertura XML report
    cmds:
      - task: test
        vars:
          CLI_ARGS: -count=1 -covermode=atomic -coverprofile=coverage.out ./...
      - go tool -modfile tools/go.mod gocover-cobertura < coverage.out > coverage.xml

  ci:check:
    desc: Check no uncommitted diffs after generate/fmt/tidy
    cmds:
      - task: fmt
        vars:
          CLI_ARGS: ./... --diff
      - task: lint
      - task: license
        vars:
          CLI_ARGS: -check .
      - task: mod-tidy
        vars:
          CLI_ARGS: -diff
      - task: generate
      - git diff --exit-code


  ci:release:
    desc: Auto-tag the next v0.1.x patch on the current commit and publish it with GoReleaser
    cmds:
      # GoReleaser releases an existing tag; it does not create one. So compute
      # the next patch version, tag HEAD, push the tag, then release it.
      - |
        set -eu
        latest="$(git tag --list 'v0.1.*' --sort=-version:refname | head -n1)"
        if [ -n "$latest" ]; then
          next="v0.1.$(( ${latest##*.} + 1 ))"
        else
          next="v0.1.0"
        fi
        echo "Releasing $next"
        git tag "$next"
        git push origin "$next"
        go tool -modfile tools/go.mod goreleaser release --clean

  ci:build:
    desc: Dry-run a release — build a snapshot (incl. nfpms) and dry-run the packagecloud publish
    cmds:
      - go tool -modfile tools/go.mod goreleaser release --snapshot --clean

version: 2

project_name: repohost

builds:
  - binary: repohost
    main: ./cmd/repohost
    env:
      - CGO_ENABLED=0
    goos:
      - windows
      - darwin
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - files:
      - LICENSE
    format_overrides:
      - goos: windows
        formats:
          - zip

release:
  prerelease: auto
  name_template: "repohost {{.Version}}"

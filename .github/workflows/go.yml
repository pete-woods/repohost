name: Go

on:
  push: {}
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Run static checks
        run: task check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: task compose-up
        run: task compose-up

      - name: Test
        run: task ci:test

      - name: task compose-down
        if: always()
        run: task compose-down

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialise releases so concurrent merges can't compute the same version.
    concurrency:
      group: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so tags are available to compute the next version
          # and the changelog range.
          fetch-depth: 0

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: task ci:release

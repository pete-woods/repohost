name: Go

on:
  # Branches only (not tags) so the tag ci:release pushes doesn't retrigger CI.
  push:
    branches: ['**']
  pull_request: {}

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Run static checks
        run: task check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: task compose-up
        run: task compose-up

      - name: Test
        run: task ci:test

      - name: task compose-down
        if: always()
        run: task compose-down

  build:
    name: Build
    # Pre-merge validation only; on main the release job builds via GoReleaser.
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      # Snapshot build (all platforms + archives) validates the release pipeline
      # on every push and PR, so a broken .goreleaser.yml is caught before a tag.
      - name: Snapshot release build
        run: task ci:build

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Serialise releases so concurrent merges can't compute the same version.
    concurrency:
      group: release
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Full history so existing tags are available to compute the next
          # version and the changelog range.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools/go.sum

      - name: Set up Task
        uses: go-task/setup-task@v2

      - name: Auto-tag and release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: task ci:release
